# Launches the app on a macOS runner in a few states (empty board, sample board, selection,
# editing, 500 extra cards, photos, reframing, connecting, Trace, Focus) and publishes screenshots as neutral
# check runs ("snapshot img<n> part<i>/<total>", base64 JPEG in the output text), so
# the canvas can be checked visually without a Mac. Runs on demand, or on pushes whose
# commit message contains [snapshot]. Fetch them with Tools/fetch-snapshots.py.
name: Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snapshot]')
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app
        run: |
          xcodebuild build -project EvidenceBoard.xcodeproj -scheme EvidenceBoard \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Launch and capture
        run: |
          app="$PWD/build/Build/Products/Debug/EvidenceBoard.app"
          printf '{ "format": "evidenceboard", "formatVersion": 1, "title": "Empty" }' > /tmp/Empty.evboard
          cp docs/examples/harbor-case.evboard /tmp/Harbor.evboard
          shot=0
          # capture <file> [scenario]: launches a fresh app instance, waits, screenshots, quits it.
          capture() {
            shot=$((shot + 1))
            open -n --env "EB_SNAPSHOT_SCENARIO=${2:-none}" -a "$app" "$1" --args -ApplePersistenceIgnoreState YES
            sleep 9
            pgrep -x EvidenceBoard >/dev/null && echo "shot $shot: running" || echo "shot $shot: APP NOT RUNNING"
            screencapture -x "/tmp/shot$shot.png"
            sips -Z 900 -s format jpeg -s formatOptions 60 "/tmp/shot$shot.png" --out "/tmp/shot$shot.jpg" >/dev/null
            pkill -x EvidenceBoard || true
            sleep 1
          }
          capture /tmp/Empty.evboard
          capture /tmp/Harbor.evboard
          capture /tmp/Harbor.evboard select
          capture /tmp/Harbor.evboard edit
          capture /tmp/Harbor.evboard stress
          capture /tmp/Empty.evboard photos
          capture /tmp/Empty.evboard photos200
          capture /tmp/Harbor.evboard caption
          capture /tmp/Harbor.evboard reframe
          capture /tmp/Harbor.evboard connect
          capture /tmp/Harbor.evboard trace
          capture /tmp/Harbor.evboard focus
          capture /tmp/Harbor.evboard string
          echo "$shot" > /tmp/shot-count
      - name: Publish images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(seq 1 "$(cat /tmp/shot-count)"); do
            b64=$(base64 -i "/tmp/shot$n.jpg" | tr -d '\n')
            total=$(( (${#b64} + 59999) / 60000 ))
            for ((i = 0; i < total; i++)); do
              name="snapshot img$n part$((i + 1))/$total"
              jq -n --arg name "$name" --arg sha "$GITHUB_SHA" --arg text "${b64:$((i * 60000)):60000}" \
                '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
                  output: {title: $name, summary: "Base64 JPEG chunk", text: $text}}' \
                | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - --silent
            done
          done
