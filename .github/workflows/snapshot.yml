# Launches the app on a macOS runner in a few states (empty board, sample board, selection,
# editing, 500 extra cards, photos, reframing, connecting, Trace, Focus, web cards, themes, search, minimap, Quick Look, the Albania board) and publishes screenshots as neutral
# check runs ("snapshot img<n> part<i>/<total>", base64 JPEG in the output text), so
# the canvas can be checked visually without a Mac. Runs on demand, or on pushes whose
# commit message contains [snapshot]. Fetch them with Tools/fetch-snapshots.py.
name: Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snapshot]')
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app
        run: |
          xcodebuild build -project EvidenceBoard.xcodeproj -scheme EvidenceBoard \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Launch and capture
        run: |
          app="$PWD/build/Build/Products/Debug/EvidenceBoard.app"
          printf '{ "format": "evidenceboard", "formatVersion": 1, "title": "Empty" }' > /tmp/Empty.evboard
          cp docs/examples/harbor-case.evboard /tmp/Harbor.evboard
          shot=0
          # capture <file> [scenario]: launches a fresh app instance, waits, screenshots, quits it.
          # Debug builds show full motion in snapshot scenarios even when this is on.
          echo "Reduce Motion: $(defaults read com.apple.universalaccess reduceMotion 2>&1)"
          capture() {
            shot=$((shot + 1))
            open -n --env "EB_SNAPSHOT_SCENARIO=${2:-none}" \
              -a "$app" "$1" --args -ApplePersistenceIgnoreState YES
            sleep 9
            pgrep -x EvidenceBoard >/dev/null && echo "shot $shot: running" || echo "shot $shot: APP NOT RUNNING"
            screencapture -x "/tmp/shot$shot.png"
            sips -Z 900 -s format jpeg -s formatOptions 60 "/tmp/shot$shot.png" --out "/tmp/shot$shot.jpg" >/dev/null
            pkill -x EvidenceBoard || true
            sleep 1
          }
          capture /tmp/Empty.evboard
          capture /tmp/Harbor.evboard
          capture /tmp/Harbor.evboard select
          capture /tmp/Harbor.evboard edit
          capture /tmp/Harbor.evboard stress
          capture /tmp/Empty.evboard photos
          capture /tmp/Empty.evboard photos200
          capture /tmp/Harbor.evboard caption
          capture /tmp/Harbor.evboard reframe
          capture /tmp/Harbor.evboard connect
          capture /tmp/Harbor.evboard trace
          capture /tmp/Harbor.evboard trace
          capture /tmp/Harbor.evboard focus
          capture /tmp/Harbor.evboard string
          capture /tmp/Empty.evboard web
          capture /tmp/Empty.evboard webzoom
          capture /tmp/Empty.evboard webzoom2
          capture /tmp/Harbor.evboard cork
          capture /tmp/Harbor.evboard blueprint
          capture /tmp/Harbor.evboard daylight
          capture /tmp/Empty.evboard webdaylight
          capture /tmp/Empty.evboard webcork
          capture /tmp/Harbor.evboard search
          capture /tmp/Harbor.evboard minimap
          capture /tmp/Harbor.evboard renderer
          # The Albania Files: the whole board, then close-ups of each part.
          cp "boards/The Albania Files.evboard" /tmp/Albania.evboard
          capture /tmp/Albania.evboard
          view=0
          for spot in "-3450 -1900 0.5" "-850 -2350 0.55" "1800 -1850 0.5" "-3450 -100 0.55" "-850 -650 0.5" "1800 -150 0.5" "1925 -3510 0.45"; do
            set -- $spot
            view=$((view + 1))
            jq --argjson x "$1" --argjson y "$2" --argjson z "$3" '.viewport = {x: $x, y: $y, zoom: $z}' \
              /tmp/Albania.evboard > "/tmp/Albania$view.evboard"
            capture "/tmp/Albania$view.evboard"
          done
          # Quick Look: register the extensions and ask Finder's machinery for a thumbnail. The
          # build is unsigned, so the system may refuse them; then qlmanage falls back to a
          # generic text icon, which isn't ours, so it's only published when ours is registered.
          pluginkit -a "$app/Contents/PlugIns/EvidenceBoardThumbnail.appex" || true
          pluginkit -a "$app/Contents/PlugIns/EvidenceBoardPreview.appex" || true
          if pluginkit -m -v -p com.apple.quicklook.thumbnail 2>&1 | grep -i evidence; then
            mkdir -p /tmp/ql
            qlmanage -t -s 900 -o /tmp/ql /tmp/Harbor.evboard 2>&1 | tail -n 3 || true
            if [ -f /tmp/ql/Harbor.evboard.png ]; then
              shot=$((shot + 1))
              sips -Z 900 -s format jpeg -s formatOptions 70 /tmp/ql/Harbor.evboard.png --out "/tmp/shot$shot.jpg" >/dev/null
              echo "shot $shot: Quick Look thumbnail"
            fi
          else
            echo "thumbnail extension not registered (unsigned build): no Quick Look shot"
          fi
          echo "$shot" > /tmp/shot-count
      - name: Launch budget (release build)
        run: |
          xcodebuild build -project EvidenceBoard.xcodeproj -scheme EvidenceBoard \
            -configuration Release -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet
          app="$PWD/build/Build/Products/Release/EvidenceBoard.app"
          # launch <file> <log>: time from process start to the first board frame.
          launch() {
            rm -f "$2"
            open -n --env "EB_LAUNCH_LOG=$2" -a "$app" "$1" --args -ApplePersistenceIgnoreState YES
            for _ in $(seq 1 40); do [ -s "$2" ] && break; sleep 0.5; done
            sleep 1
            pkill -x EvidenceBoard || true
            sleep 1
            head -n 1 "$2" 2>/dev/null || echo 99999
          }
          # The very first launch of a fresh, unsigned build pays for the system scanning and
          # registering it, which a downloaded, notarized app pays once at install. Do that
          # once, then empty the file cache so the next launch reads everything from disk.
          echo "first launch after build: $(launch /tmp/Empty.evboard /tmp/l0.txt) ms"
          sudo purge
          cold=$(launch /tmp/Empty.evboard /tmp/l1.txt)
          warm=""
          for n in 2 3 4 5 6; do warm="$warm $(launch /tmp/Empty.evboard /tmp/l$n.txt)"; done
          board=$(launch /tmp/Harbor.evboard /tmp/l7.txt)
          median=$(echo $warm | tr ' ' '\n' | sort -n | sed -n 3p)
          echo "cold $cold ms; warm$warm ms (median $median); sample board $board ms"
          # Where the time goes: before "app code starts" is the system (exec, dyld, AppKit).
          for n in 1 4 7; do echo "--- launch $n"; tail -n +2 "/tmp/l$n.txt" 2>/dev/null; done
          verdict() { [ "$1" -lt 400 ] && echo pass || echo FAIL; }
          {
            echo "### Launch (release build, GitHub macOS 15 runner)"
            echo "| Budget | Measured | Target | Result |"
            echo "|---|---|---|---|"
            echo "| Cold launch to empty board (file cache purged) | ${cold} ms | < 400 ms | $(verdict "$cold") |"
            echo "| Warm launch to empty board (median of 5) | ${median} ms | < 400 ms | $(verdict "$median") |"
            echo "| Launch to the sample board | ${board} ms | < 400 ms | $(verdict "$board") |"
            echo
            echo "Steps of the sample board launch:"
            echo
            tail -n +2 /tmp/l7.txt 2>/dev/null | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(seq 1 "$(cat /tmp/shot-count)"); do
            b64=$(base64 -i "/tmp/shot$n.jpg" | tr -d '\n')
            total=$(( (${#b64} + 59999) / 60000 ))
            for ((i = 0; i < total; i++)); do
              name="snapshot img$n part$((i + 1))/$total"
              jq -n --arg name "$name" --arg sha "$GITHUB_SHA" --arg text "${b64:$((i * 60000)):60000}" \
                '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
                  output: {title: $name, summary: "Base64 JPEG chunk", text: $text}}' \
                | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - --silent
            done
          done
