# Launches the app on a macOS runner and prints window screenshots into the log
# (base64 JPEG lines prefixed with IMG<n>:), so the canvas can be checked visually
# without a Mac. Runs on demand, or on pushes whose commit message contains [snapshot].
name: Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snapshot]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app
        run: |
          xcodebuild build -project EvidenceBoard.xcodeproj -scheme EvidenceBoard \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Launch and capture
        run: |
          app=build/Build/Products/Debug/EvidenceBoard.app
          cat > /tmp/window.swift <<'SWIFT'
          import CoreGraphics
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []
          let mine = windows.filter { ($0[kCGWindowOwnerName as String] as? String) == "EvidenceBoard" && ($0[kCGWindowLayer as String] as? Int) == 0 }
          if let id = mine.first?[kCGWindowNumber as String] { print(id) }
          SWIFT
          capture() {
            sleep 6
            id=$(swift /tmp/window.swift)
            echo "window id: ${id:-none}"
            screencapture -x -o ${id:+-l$id} "/tmp/shot$1.png"
            sips -Z "$2" -s format jpeg -s formatOptions 55 "/tmp/shot$1.png" --out "/tmp/shot$1.jpg" >/dev/null
            echo "shot $1: $(sips -g pixelWidth -g pixelHeight /tmp/shot$1.jpg | tail -2 | xargs) $(stat -f%z /tmp/shot$1.jpg) bytes"
          }
          printf '{ "format": "evidenceboard", "formatVersion": 1, "title": "Empty" }' > /tmp/Empty.evboard
          cp docs/examples/harbor-case.evboard /tmp/Harbor.evboard
          open -a "$PWD/$app" /tmp/Empty.evboard
          capture 1 560
          open -a "$PWD/$app" /tmp/Harbor.evboard
          capture 2 900
          pgrep -x EvidenceBoard >/dev/null && echo "app still running" || echo "APP NOT RUNNING"
      - name: Print images
        run: for n in 1 2; do base64 -i "/tmp/shot$n.jpg" | fold -w 6000 | sed "s/^/IMG$n:/"; done
