# Launches the app on a macOS runner and publishes window screenshots as neutral
# check runs ("snapshot img<n> part<i>/<total>", base64 JPEG in the output text), so
# the canvas can be checked visually without a Mac. Runs on demand, or on pushes whose
# commit message contains [snapshot]. Fetch them with Tools/fetch-snapshots.py.
name: Snapshot

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[snapshot]')
    runs-on: macos-15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build app
        run: |
          xcodebuild build -project EvidenceBoard.xcodeproj -scheme EvidenceBoard \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Launch and capture
        run: |
          app=build/Build/Products/Debug/EvidenceBoard.app
          capture() {
            sleep 6
            screencapture -x "/tmp/shot$1.png"
            sips -Z 900 -s format jpeg -s formatOptions 60 "/tmp/shot$1.png" --out "/tmp/shot$1.jpg" >/dev/null
          }
          printf '{ "format": "evidenceboard", "formatVersion": 1, "title": "Empty" }' > /tmp/Empty.evboard
          cp docs/examples/harbor-case.evboard /tmp/Harbor.evboard
          open -a "$PWD/$app" /tmp/Empty.evboard
          capture 1
          open -a "$PWD/$app" /tmp/Harbor.evboard
          capture 2
          pgrep -x EvidenceBoard >/dev/null && echo "app still running" || echo "APP NOT RUNNING"
      - name: Publish images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in 1 2; do
            b64=$(base64 -i "/tmp/shot$n.jpg" | tr -d '\n')
            total=$(( (${#b64} + 59999) / 60000 ))
            for ((i = 0; i < total; i++)); do
              name="snapshot img$n part$((i + 1))/$total"
              jq -n --arg name "$name" --arg sha "$GITHUB_SHA" --arg text "${b64:$((i * 60000)):60000}" \
                '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
                  output: {title: $name, summary: "Base64 JPEG chunk", text: $text}}' \
                | gh api "repos/$GITHUB_REPOSITORY/check-runs" --input - --silent
            done
          done
